apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdk 34  // Updated from 30
    buildToolsVersion "34.0.0"  // Updated from 30.0.1
    
    namespace 'com.parad1stgames.game'  // REQUIRED for AGP 8.0+
    
    defaultConfig {
        minSdk 21
        targetSdk 34  // Updated from 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        applicationId 'com.parad1stgames.game'
        versionName "parad1st-games-0.1"
        versionCode 10
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled = true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'  // Added arm64-v8a
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    
    // Core AndroidX - Updated versions
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // Third-party dependencies - Updated versions
    implementation 'com.tuyenmonkey:mkloader:1.4.0'
    implementation 'org.ini4j:ini4j:0.5.4'
    implementation 'com.github.skydoves:colorpickerpreference:2.0.6'
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.dinuscxj:circleprogressbar:1.3.6'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.smarteist:autoimageslider:1.4.0'
    implementation 'com.github.pedromassango:doubleClick:v1.1'
    
    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // Networking
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    
    // File handling
    implementation 'com.mindorks.android:prdownloader:0.6.0'
    implementation 'com.github.hzy3774:AndroidP7zip:v1.7.2'
    implementation 'com.hzy:un7zip:+'
    implementation 'com.liulishuo.filedownloader:library:1.7.7'
    
    // Firebase - Updated BOM
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
